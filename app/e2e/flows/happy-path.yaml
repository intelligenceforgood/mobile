appId: com.i4g.mobile
---
- launchApp

# Wait for the sign-in screen to appear
- assertVisible:
    text: 'Continue as Local Analyst'
    timeout: 5000

# Tap the local analyst shortcut to bypass Google SSO
- tapOn:
    text: 'Continue as Local Analyst'

# Dashboard should load — assert at least one metric card is visible
- assertVisible:
    id: 'metrics-grid'
    timeout: 8000

# Navigate to the Reviews Queue tab
- tapOn:
    text: 'Queue'

# At least one queue row should be visible (requires local-aio with seeded data)
- assertVisible:
    id: 'load-more'
    timeout: 8000

# ── Sprint 3: Queue → Case Detail → Evidence → Report ──────────────────────

# Tap the first queue row to navigate to Case Detail
- tapOn:
    id: 'queue-row'
    index: 0

# Case Detail should load — assert header section is visible
- assertVisible:
    id: 'case-detail-screen'
    timeout: 8000

- assertVisible:
    id: 'case-header'
    timeout: 5000

# Evidence grid should appear (may be empty if no evidence seeded — that's OK)
- assertVisible:
    id: 'evidence-grid'
    timeout: 5000

# Tap the first evidence tile if present
- tapOn:
    id: 'evidence-tile'
    index: 0
    optional: true

# If we navigated to Evidence Detail, assert it loaded
- assertVisible:
    id: 'evidence-detail-screen'
    timeout: 5000
    optional: true

# Go back to Case Detail
- back

# Assert Case Detail is still visible after back navigation
- assertVisible:
    id: 'case-detail-screen'
    timeout: 5000

# ── Sprint 4: Approve / Reject decision flow ───────────────────────────────

# Tap the Decide button (only present for decidable statuses — guard with optional)
- tapOn:
    id: 'decide-button'
    optional: true

# If the Decision Sheet opened, assert the segmented control is visible
- assertVisible:
    id: 'decision-segment-approve'
    timeout: 3000
    optional: true

# Submit the decision
- tapOn:
    id: 'decision-submit'
    optional: true

# Success toast should appear
- assertVisible:
    id: 'toast-success'
    timeout: 5000
    optional: true

# Tap "View Report" if visible (only shown when a report exists)
- tapOn:
    id: 'view-report'
    optional: true

# If Report screen opened, assert it rendered
- assertVisible:
    id: 'report-screen'
    timeout: 5000
    optional: true
